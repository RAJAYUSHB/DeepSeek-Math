<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F3EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141416" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Hold</title>
<style>
  :root {
    --bg: #F5F3EF;
    --card: #FFFFFF;
    --ink: #1D1D1F;
    --ink-2: #6E6E73;
    --ink-3: #A1A1A6;
    --line: rgba(0, 0, 0, .07);
    --shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 8px 24px rgba(0, 0, 0, .04);
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Inter, Arial, sans-serif;
    --rest-fill: #DCE4EC;
    --rest-deep: #4A5D70;
  }
  .t-sage     { --fill: #CFE3D6; --deep: #2F5D49; --soft: #E6F0E9; }
  .t-peach    { --fill: #F7D9C4; --deep: #8A4B26; --soft: #FBEBDF; }
  .t-lavender { --fill: #DCD6F2; --deep: #4B3F8A; --soft: #ECE9F8; }
  .t-sky      { --fill: #CFE2F0; --deep: #2A5675; --soft: #E5EFF7; }
  .t-butter   { --fill: #F4E6B5; --deep: #6E5712; --soft: #F9F1D8; }
  .t-rose     { --fill: #F2D3DA; --deep: #8A3A4F; --soft: #F8E7EB; }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141416; --card: #1E1E21; --ink: #F5F5F7; --ink-2: #A1A1A6; --ink-3: #6E6E73;
      --line: rgba(255, 255, 255, .08); --shadow: none;
      --rest-fill: #27313B; --rest-deep: #B7C8D9;
    }
    .t-sage     { --fill: #29443A; --deep: #A8D5BD; --soft: #20302A; }
    .t-peach    { --fill: #523625; --deep: #F2C4A8; --soft: #33261E; }
    .t-lavender { --fill: #363058; --deep: #C9C2F0; --soft: #27243A; }
    .t-sky      { --fill: #233A4C; --deep: #B3D4EC; --soft: #1E2A34; }
    .t-butter   { --fill: #4A4020; --deep: #EDD98F; --soft: #302B1B; }
    .t-rose     { --fill: #4E2D36; --deep: #F0BFCB; --soft: #33232A; }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--font);
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    overscroll-behavior: none;
  }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
  svg.i { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  .screen { display: none; }
  .screen.active { display: block; }
  .wrap {
    max-width: 460px; margin: 0 auto; min-height: 100dvh;
    padding: max(20px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
  }

  /* ---------- Home ---------- */
  .eyebrow { font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); margin: 8px 0 4px; }
  h1 { font-size: 34px; line-height: 1.1; font-weight: 700; letter-spacing: -.025em; margin: 0 0 20px; }
  h2 { font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); margin: 28px 4px 10px; }

  .week { background: var(--card); border-radius: 22px; padding: 16px 18px; box-shadow: var(--shadow); display: flex; align-items: flex-end; gap: 16px; }
  .week-total { flex: 1; min-width: 0; }
  .week-total b { display: block; font-size: 28px; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .week-total span { font-size: 13px; color: var(--ink-2); }
  .bars { display: flex; gap: 6px; align-items: flex-end; height: 56px; }
  .bar { width: 10px; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; }
  .bar i { display: block; width: 100%; border-radius: 5px; background: var(--line); min-height: 4px; }
  .bar.has i { background: #9FC3AE; }
  .bar.today i { background: #2F5D49; }
  @media (prefers-color-scheme: dark) { .bar.has i { background: #4C7563; } .bar.today i { background: #A8D5BD; } }
  .bar small { font-size: 10px; color: var(--ink-3); font-weight: 600; }

  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .wk {
    background: var(--card); border-radius: 20px; padding: 16px 6px 14px; box-shadow: var(--shadow);
    display: flex; flex-direction: column; align-items: center; gap: 10px; transition: transform .15s ease;
  }
  .wk:active { transform: scale(.96); }
  .wk .ic { width: 54px; height: 54px; border-radius: 18px; background: var(--soft); color: var(--deep); display: grid; place-items: center; }
  .wk .ic svg.i { width: 30px; height: 30px; stroke-width: 1.6; }
  .wk span { font-size: 14px; font-weight: 600; letter-spacing: -.01em; text-align: center; }

  .note { font-size: 13px; color: var(--ink-3); text-align: center; margin: 24px 12px 0; line-height: 1.45; }

  /* ---------- Setup ---------- */
  .topbar { display: flex; align-items: center; justify-content: space-between; height: 44px; }
  .iconbtn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--ink); }
  .iconbtn:active { background: var(--line); }
  .setup-head { display: flex; align-items: center; gap: 14px; margin: 8px 0 4px; }
  .setup-head .ic { width: 60px; height: 60px; border-radius: 20px; background: var(--fill); color: var(--deep); display: grid; place-items: center; }
  .setup-head .ic svg.i { width: 34px; height: 34px; stroke-width: 1.6; }
  .setup-head h1 { margin: 0; }

  .chips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .chip {
    background: var(--card); border-radius: 18px; padding: 16px 4px; box-shadow: var(--shadow);
    display: flex; align-items: baseline; justify-content: center; gap: 4px;
    border: 2px solid transparent; transition: background .15s, border-color .15s, transform .15s;
  }
  .chip:active { transform: scale(.96); }
  .chip b { font-size: 26px; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .chip small { font-size: 13px; color: var(--ink-2); font-weight: 500; }
  .chip.sel { background: var(--fill); border-color: var(--deep); color: var(--deep); }
  .chip.sel small { color: var(--deep); }
  .chips.small .chip { padding: 12px 4px; border-radius: 14px; }
  .chips.small .chip b { font-size: 17px; }
  .chips.five { grid-template-columns: repeat(5, 1fr); gap: 8px; }

  .panel { background: var(--card); border-radius: 20px; box-shadow: var(--shadow); padding: 6px 6px 6px 18px; display: flex; align-items: center; justify-content: space-between; min-height: 64px; }
  .panel + .panel { margin-top: 10px; }
  .panel label { font-size: 16px; font-weight: 500; }
  .panel label small { display: block; font-size: 13px; color: var(--ink-2); font-weight: 400; margin-top: 2px; }
  .stepper { display: flex; align-items: center; gap: 4px; }
  .stepper button { width: 44px; height: 44px; border-radius: 14px; background: var(--soft); color: var(--deep); display: grid; place-items: center; }
  .stepper button:active { transform: scale(.94); }
  .stepper output { min-width: 64px; text-align: center; font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  #customRow { margin-top: 10px; }

  .switch { width: 51px; height: 31px; border-radius: 16px; background: var(--line); position: relative; transition: background .2s; margin-right: 10px; }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.18); transition: transform .2s; }
  .switch[aria-checked="true"] { background: var(--deep); }
  .switch[aria-checked="true"]::after { transform: translateX(20px); }

  .primary {
    display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; height: 58px; margin-top: 28px;
    border-radius: 18px; background: var(--deep); color: var(--bg); font-size: 17px; font-weight: 600; letter-spacing: -.01em;
    transition: transform .15s;
  }
  .primary:active { transform: scale(.98); }

  /* ---------- Timer ---------- */
  #timer.active { position: fixed; inset: 0; overflow: hidden; background: var(--bg); user-select: none; -webkit-user-select: none; }
  .fill {
    position: absolute; inset: 0; background: var(--fill);
    transform: translateY(100%); transition: transform .12s linear, background .5s ease; will-change: transform;
  }
  .fill .wave { position: absolute; left: 0; top: -15px; width: 200%; height: 16px; color: var(--fill); transition: color .5s ease; animation: drift 4s linear infinite; }
  @keyframes drift { to { transform: translateX(-50%); } }
  #timer[data-phase="rest"] .fill, #timer[data-phase="rest"] .fill .wave { --fill: var(--rest-fill); }
  #timer[data-phase="rest"] { --deep: var(--rest-deep); }
  #timer.paused .fill .wave { animation-play-state: paused; }

  .marks { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .4s; }
  #timer[data-phase="work"] .marks, #timer[data-phase="lead"] .marks { opacity: 1; }
  .mk { position: absolute; left: 0; right: 0; height: 0; border-top: 1px dashed var(--line); }
  .mk span {
    position: absolute; right: 16px; top: -11px; height: 22px; min-width: 22px; padding: 0 7px; border-radius: 11px;
    font-size: 11px; font-weight: 600; display: grid; place-items: center; color: var(--ink-3); background: var(--bg);
    transition: background .3s, color .3s, transform .3s;
  }
  .mk.hit span { background: var(--deep); color: var(--bg); transform: scale(1.08); }

  .t-top {
    position: absolute; top: 0; left: 0; right: 0; z-index: 2;
    padding: max(12px, env(safe-area-inset-top)) 12px 0; display: flex; align-items: center; gap: 8px;
  }
  .t-title { flex: 1; min-width: 0; text-align: center; }
  .t-title b { display: block; font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
  .pills { display: flex; gap: 4px; justify-content: center; margin-top: 6px; }
  .pills i { width: 22px; height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; position: relative; }
  .pills i u { position: absolute; inset: 0; background: var(--deep); transform-origin: left; transform: scaleX(0); text-decoration: none; }

  .mic {
    height: 36px; padding: 0 12px 0 10px; border-radius: 18px; display: flex; align-items: center; gap: 6px;
    font-size: 13px; font-weight: 600; background: var(--card); box-shadow: var(--shadow); color: var(--ink-2);
  }
  .mic svg.i { width: 18px; height: 18px; }
  .mic .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); }
  .mic.on { color: var(--deep); }
  .mic.on .dot { background: #34C759; animation: pulse 1.6s ease-in-out infinite; }
  .mic.err .dot { background: #FF9F0A; }
  @keyframes pulse { 50% { opacity: .35; transform: scale(.8); } }

  .t-center {
    position: absolute; inset: 0; z-index: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 0 24px 80px; text-align: center; pointer-events: none;
  }
  .phase { font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--deep); min-height: 16px; }
  .big {
    font-size: clamp(104px, 34vw, 184px); font-weight: 200; letter-spacing: -.05em; line-height: 1;
    font-variant-numeric: tabular-nums; margin: 6px 0 2px; display: flex; align-items: baseline; justify-content: center;
  }
  .big small { font-size: 22px; font-weight: 500; letter-spacing: 0; color: var(--ink-2); margin-left: 6px; }
  .sub { font-size: 16px; color: var(--ink-2); font-variant-numeric: tabular-nums; min-height: 22px; }
  .sub b { color: var(--ink); font-weight: 600; }
  .lead-pop { animation: pop .9s ease-out; }
  @keyframes pop { from { transform: scale(1.25); opacity: .2; } 30% { opacity: 1; } to { transform: scale(1); } }

  .heard {
    margin-top: 18px; height: 30px; padding: 0 14px; border-radius: 15px; background: var(--card); box-shadow: var(--shadow);
    font-size: 14px; font-weight: 500; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px;
    opacity: 0; transform: translateY(6px); transition: opacity .25s, transform .25s;
  }
  .heard.show { opacity: 1; transform: none; }
  .heard b { color: var(--deep); font-weight: 600; }

  .t-bottom {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 2;
    padding: 0 24px max(28px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: center; gap: 16px;
  }
  .controls { display: flex; align-items: center; justify-content: center; gap: 28px; }
  .ctl { width: 58px; height: 58px; border-radius: 50%; background: var(--card); box-shadow: var(--shadow); display: grid; place-items: center; color: var(--ink); transition: transform .15s, opacity .2s; }
  .ctl:active { transform: scale(.92); }
  .ctl[hidden] { display: grid !important; visibility: hidden; }
  .play { width: 84px; height: 84px; background: var(--deep); color: var(--bg); box-shadow: 0 10px 30px rgba(0,0,0,.12); }
  .play svg.i { width: 32px; height: 32px; fill: currentColor; stroke-width: 1.4; }
  .hint { font-size: 13px; color: var(--ink-2); text-align: center; line-height: 1.5; }
  .hint q { font-weight: 600; color: var(--ink); quotes: "\201C" "\201D"; }

  .done-actions { display: none; width: 100%; max-width: 420px; gap: 10px; }
  .done-actions button { flex: 1; height: 56px; border-radius: 18px; font-size: 16px; font-weight: 600; }
  .done-actions .again { background: var(--deep); color: var(--bg); }
  .done-actions .new { background: var(--card); box-shadow: var(--shadow); }
  #timer[data-phase="done"] .controls { display: none; }
  #timer[data-phase="done"] .done-actions { display: flex; }

  .check { display: none; position: relative; width: 120px; height: 120px; margin: 8px 0 14px; }
  #timer[data-phase="done"] .check { display: block; }
  #timer[data-phase="done"] .big { display: none; }
  .check svg { width: 100%; height: 100%; color: var(--deep); }
  .check circle { stroke-dasharray: 340; stroke-dashoffset: 340; animation: draw .7s ease-out forwards; }
  .check path { stroke-dasharray: 80; stroke-dashoffset: 80; animation: draw .4s .55s ease-out forwards; }
  .check::before, .check::after {
    content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--deep); opacity: 0;
    animation: ring 1.4s .5s ease-out;
  }
  .check::after { animation-delay: .75s; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes ring { from { opacity: .5; transform: scale(1); } to { opacity: 0; transform: scale(1.9); } }
  .done-stats { display: none; margin-top: 18px; gap: 10px; }
  #timer[data-phase="done"] .done-stats { display: flex; }
  .stat { background: var(--card); box-shadow: var(--shadow); border-radius: 16px; padding: 10px 16px; min-width: 110px; }
  .stat b { display: block; font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .stat span { font-size: 12px; color: var(--ink-2); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .check circle, .check path { stroke-dashoffset: 0; }
  }
</style>
</head>
<body>

<!-- Home: pick a workout -->
<section id="home" class="screen active">
  <div class="wrap">
    <p class="eyebrow" id="today"></p>
    <h1>What are we<br>working on?</h1>

    <div class="week" aria-label="This week">
      <div class="week-total">
        <b id="todayTotal">0 sec</b>
        <span id="todaySets">today · nothing yet</span>
      </div>
      <div class="bars" id="bars"></div>
    </div>

    <h2>Workouts</h2>
    <div class="grid" id="grid"></div>

    <p class="note">Hands busy? Start and stop with your voice.<br>Works best in Chrome, Edge or Safari.</p>
  </div>
</section>

<!-- Setup: pick a duration -->
<section id="setup" class="screen">
  <div class="wrap">
    <div class="topbar">
      <button class="iconbtn" data-go="home" aria-label="Back">
        <svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
    </div>
    <div class="setup-head">
      <div class="ic" id="setupIcon"></div>
      <h1 id="setupName"></h1>
    </div>

    <h2>How long?</h2>
    <div class="chips" id="durations"></div>
    <div class="panel" id="customRow" hidden>
      <label>Custom</label>
      <div class="stepper">
        <button data-step="custom" data-d="-5" aria-label="5 seconds less"><svg class="i" viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
        <output id="customOut">1:15</output>
        <button data-step="custom" data-d="5" aria-label="5 seconds more"><svg class="i" viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></svg></button>
      </div>
    </div>

    <h2>Sets</h2>
    <div class="panel">
      <label>Sets<small id="setsNote">One and done</small></label>
      <div class="stepper">
        <button data-step="sets" data-d="-1" aria-label="Fewer sets"><svg class="i" viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
        <output id="setsOut">1</output>
        <button data-step="sets" data-d="1" aria-label="More sets"><svg class="i" viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></svg></button>
      </div>
    </div>
    <div id="restWrap" hidden>
      <h2>Rest between sets</h2>
      <div class="chips small five" id="rests"></div>
    </div>

    <h2>Coach</h2>
    <div class="panel">
      <label>Spoken cues<small>“Go”, “Halfway”, “Ten seconds”, “Done”</small></label>
      <button class="switch" id="coachSwitch" role="switch" aria-checked="true" aria-label="Spoken cues"></button>
    </div>

    <button class="primary" id="readyBtn">
      <svg class="i" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>
      Ready
    </button>
    <p class="note">Next, allow the microphone, get into position<br>and say <b>“start”</b>.</p>
  </div>
</section>

<!-- Timer -->
<section id="timer" class="screen" data-phase="idle">
  <div class="fill" id="fill">
    <svg class="wave" viewBox="0 0 200 16" preserveAspectRatio="none" aria-hidden="true">
      <path fill="currentColor" d="M0 8 Q12.5 0 25 8 T50 8 T75 8 T100 8 T125 8 T150 8 T175 8 T200 8 V16 H0Z"/>
    </svg>
  </div>
  <div class="marks" aria-hidden="true">
    <div class="mk" data-m="0.25" style="bottom:25%"><span>25%</span></div>
    <div class="mk" data-m="0.5"  style="bottom:50%"><span>½</span></div>
    <div class="mk" data-m="0.75" style="bottom:75%"><span>75%</span></div>
  </div>

  <div class="t-top">
    <button class="iconbtn" id="closeBtn" aria-label="Close">
      <svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div class="t-title">
      <b id="tName"></b>
      <div class="pills" id="pills"></div>
    </div>
    <button class="mic" id="micBtn" aria-label="Toggle voice control">
      <span class="dot"></span>
      <svg class="i" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>
      <span id="micLabel">Off</span>
    </button>
  </div>

  <div class="t-center">
    <div class="phase" id="phase" aria-live="polite"></div>
    <div class="check" aria-hidden="true">
      <svg viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="60" cy="60" r="54"/><path d="M38 61l15 15 30-32"/>
      </svg>
    </div>
    <div class="big" id="big"></div>
    <div class="sub" id="sub"></div>
    <div class="done-stats">
      <div class="stat"><b id="sToday">0</b><span>today</span></div>
      <div class="stat"><b id="sWeek">0</b><span>this week</span></div>
    </div>
    <div class="heard" id="heard"><span>Heard</span> <b id="heardWord"></b></div>
  </div>

  <div class="t-bottom">
    <div class="controls">
      <button class="ctl" id="resetBtn" aria-label="Reset">
        <svg class="i" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/></svg>
      </button>
      <button class="ctl play" id="playBtn" aria-label="Start"></button>
      <button class="ctl" id="skipBtn" aria-label="Finish">
        <svg class="i" viewBox="0 0 24 24"><path d="M5 5l8 7-8 7zM18 5v14"/></svg>
      </button>
    </div>
    <div class="done-actions">
      <button class="new" id="newBtn">New workout</button>
      <button class="again" id="againBtn">Again</button>
    </div>
    <p class="hint" id="hint"></p>
  </div>
</section>

<script>
(() => {
  'use strict';

  // ---------- Data ----------
  const ICONS = {
    plank:   '<circle cx="4.5" cy="9.5" r="1.8"/><path d="M6.5 10.5 20 14M7.5 11v4.5h3M20 14l1.5 2.5M2.5 17.5h19"/>',
    pushups: '<circle cx="4.5" cy="8" r="1.8"/><path d="M6.5 9 20 13.5M8.5 9.8v6.7M20 13.5l1.5 3M2.5 17.5h19"/>',
    squats:  '<circle cx="12.5" cy="4" r="1.8"/><path d="M12 6.5 8 12.5h6l-1 7.5M11.5 8.5H18M7 20.5h8"/>',
    jacks:   '<circle cx="12" cy="3.8" r="1.8"/><path d="M12 6.5v7M12 8.5 7 3.5M12 8.5l5-5M12 13.5 8 20.5M12 13.5l4 7"/>',
    lunges:  '<circle cx="11" cy="3.8" r="1.8"/><path d="M11 6.5v6M11 12.5l4.5 2v5.5M11 12.5l-3 5.5H5M9 9h5"/>',
    wallsit: '<path d="M4 2.5v19"/><circle cx="8" cy="5" r="1.8"/><path d="M7 7.5v6h6v6.5M7 10h4"/>',
    hiit:    '<path d="M13.5 2.5 5 13.5h6l-1 8 8.5-11h-6z"/>',
    stretch: '<circle cx="14.5" cy="5" r="1.8"/><path d="M13.5 7.5Q11 11 11.5 14M11.5 14l-3 6.5M11.5 14l3 6.5M13 9.5Q8 8 6.5 3.5M12.5 10.5l4.5 1.5"/>',
    free:    '<circle cx="12" cy="13.5" r="7.5"/><path d="M12 13.5V9.5M10 2.5h4M18 7l1.5-1.5"/>'
  };
  const WORKOUTS = [
    { id: 'plank',   name: 'Plank',         tint: 'sage',     presets: [30, 45, 60, 90, 120] },
    { id: 'pushups', name: 'Push-ups',      tint: 'peach',    presets: [20, 30, 45, 60, 90] },
    { id: 'squats',  name: 'Squats',        tint: 'lavender', presets: [30, 45, 60, 90, 120] },
    { id: 'jacks',   name: 'Jumping Jacks', tint: 'sky',      presets: [30, 45, 60, 90, 120] },
    { id: 'lunges',  name: 'Lunges',        tint: 'rose',     presets: [30, 45, 60, 90, 120] },
    { id: 'wallsit', name: 'Wall Sit',      tint: 'butter',   presets: [30, 45, 60, 90, 120] },
    { id: 'hiit',    name: 'HIIT',          tint: 'peach',    presets: [20, 30, 40, 45, 60] },
    { id: 'stretch', name: 'Stretch',       tint: 'lavender', presets: [30, 45, 60, 90, 120] },
    { id: 'free',    name: 'Free Timer',    tint: 'sage',     presets: [30, 45, 60, 90, 120] }
  ];
  const RESTS = [0, 10, 15, 30, 60];
  const LEAD_IN = 3;

  const $ = s => document.querySelector(s);
  const icon = (id, cls = 'i') => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[id]}</svg>`;
  const PLAY = '<svg class="i" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z"/></svg>';
  const PAUSE = '<svg class="i" viewBox="0 0 24 24"><rect x="6.5" y="5" width="3.5" height="14" rx="1"/><rect x="14" y="5" width="3.5" height="14" rx="1"/></svg>';

  // ---------- Formatting ----------
  const mmss = s => { s = Math.max(0, Math.round(s)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
  const chipParts = s => s < 60 ? [s, 'sec'] : s % 60 === 0 ? [s / 60, 'min'] : [mmss(s), 'min'];
  const human = s => {
    s = Math.round(s);
    if (s < 60) return `${s} sec`;
    const m = Math.floor(s / 60), r = s % 60;
    return r ? `${m} min ${r} s` : `${m} min`;
  };
  const dayKey = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

  // ---------- Log (per-device) ----------
  const LOG_KEY = 'hold-timer:log';
  const loadLog = () => { try { return JSON.parse(localStorage.getItem(LOG_KEY)) || {}; } catch { return {}; } };
  function addToLog(sec) {
    if (sec < 1) return;
    const log = loadLog(), k = dayKey();
    log[k] = log[k] || { sets: 0, sec: 0 };
    log[k].sets += 1;
    log[k].sec += Math.round(sec);
    const keys = Object.keys(log).sort();
    while (keys.length > 60) delete log[keys.shift()];
    try { localStorage.setItem(LOG_KEY, JSON.stringify(log)); } catch {}
  }
  function lastDays(n) {
    const log = loadLog(), out = [];
    for (let i = n - 1; i >= 0; i--) {
      const d = new Date(); d.setDate(d.getDate() - i);
      out.push({ d, ...(log[dayKey(d)] || { sets: 0, sec: 0 }) });
    }
    return out;
  }

  // ---------- State ----------
  const S = { workout: WORKOUTS[0], duration: 45, custom: 75, isCustom: false, sets: 1, rest: 15, coach: true };
  try { S.coach = localStorage.getItem('hold-timer:coach') !== 'off'; } catch {}

  function show(id) {
    document.querySelectorAll('.screen').forEach(el => el.classList.toggle('active', el.id === id));
    window.scrollTo(0, 0);
    if (id === 'home') renderHome();
  }
  document.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => show(b.dataset.go)));

  // ---------- Home ----------
  $('#grid').innerHTML = WORKOUTS.map(w =>
    `<button class="wk t-${w.tint}" data-id="${w.id}"><div class="ic">${icon(w.id)}</div><span>${w.name}</span></button>`
  ).join('');
  $('#grid').addEventListener('click', e => {
    const b = e.target.closest('.wk'); if (!b) return;
    openSetup(WORKOUTS.find(w => w.id === b.dataset.id));
  });

  function renderHome() {
    $('#today').textContent = new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
    const days = lastDays(7), today = days[6];
    const max = Math.max(60, ...days.map(d => d.sec));
    $('#todayTotal').textContent = human(today.sec);
    $('#todaySets').textContent = today.sets ? `today · ${today.sets} set${today.sets > 1 ? 's' : ''}` : 'today · nothing yet';
    $('#bars').innerHTML = days.map((d, i) =>
      `<div class="bar${d.sec ? ' has' : ''}${i === 6 ? ' today' : ''}" title="${human(d.sec)}"><i style="height:${Math.max(4, d.sec / max * 40)}px"></i><small>${d.d.toLocaleDateString(undefined, { weekday: 'narrow' })}</small></div>`
    ).join('');
  }

  // ---------- Setup ----------
  function openSetup(w) {
    S.workout = w;
    S.duration = w.presets.includes(45) ? 45 : w.presets[1];
    S.isCustom = false;
    $('#setup').className = `screen t-${w.tint}`;
    $('#setupIcon').innerHTML = icon(w.id);
    $('#setupName').textContent = w.name;
    renderSetup();
    show('setup');
  }
  function renderSetup() {
    const w = S.workout;
    $('#durations').innerHTML = w.presets.map(s => {
      const [n, u] = chipParts(s);
      return `<button class="chip${!S.isCustom && S.duration === s ? ' sel' : ''}" data-s="${s}"><b>${n}</b><small>${u}</small></button>`;
    }).join('') + `<button class="chip${S.isCustom ? ' sel' : ''}" data-s="custom"><b style="font-size:17px">Custom</b></button>`;
    $('#customRow').hidden = !S.isCustom;
    $('#customOut').textContent = mmss(S.custom);
    $('#setsOut').textContent = S.sets;
    $('#setsNote').textContent = S.sets === 1 ? 'One and done' : `${S.sets} × ${human(S.isCustom ? S.custom : S.duration)}`;
    $('#restWrap').hidden = S.sets === 1;
    $('#rests').innerHTML = RESTS.map(r =>
      `<button class="chip${S.rest === r ? ' sel' : ''}" data-r="${r}"><b>${r ? r + 's' : 'None'}</b></button>`
    ).join('');
    $('#coachSwitch').setAttribute('aria-checked', S.coach);
  }
  $('#durations').addEventListener('click', e => {
    const b = e.target.closest('.chip'); if (!b) return;
    if (b.dataset.s === 'custom') S.isCustom = true;
    else { S.isCustom = false; S.duration = +b.dataset.s; }
    renderSetup();
  });
  $('#rests').addEventListener('click', e => {
    const b = e.target.closest('.chip'); if (!b) return;
    S.rest = +b.dataset.r; renderSetup();
  });
  document.querySelectorAll('[data-step]').forEach(b => b.addEventListener('click', () => {
    const d = +b.dataset.d;
    if (b.dataset.step === 'custom') S.custom = Math.min(3600, Math.max(5, S.custom + (S.custom >= 300 ? d * 3 : d)));
    else S.sets = Math.min(10, Math.max(1, S.sets + d));
    renderSetup();
  }));
  $('#coachSwitch').addEventListener('click', () => {
    S.coach = !S.coach;
    try { localStorage.setItem('hold-timer:coach', S.coach ? 'on' : 'off'); } catch {}
    renderSetup();
  });
  $('#readyBtn').addEventListener('click', () => {
    unlockAudio();
    openTimer();
    startListening();
  });

  // ---------- Sound, speech, haptics ----------
  let actx = null;
  function unlockAudio() {
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
    } catch {}
  }
  function tone(freq, dur = .12, vol = .2, at = 0) {
    if (!actx) return;
    const t = actx.currentTime + at, o = actx.createOscillator(), g = actx.createGain();
    o.type = 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + .012);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(actx.destination);
    o.start(t); o.stop(t + dur + .05);
  }
  const tick3 = () => tone(740, .1, .18);
  const goTone = () => { tone(880, .14, .22); tone(1320, .3, .2, .1); };
  const softChime = () => { tone(1046, .35, .1); tone(1568, .45, .07, .06); };
  const doneChime = () => { [523, 659, 784, 1046].forEach((f, i) => tone(f, .5, .16, i * .11)); };
  const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch {} };

  let lastSpokenAt = 0;
  function speak(text) {
    if (!S.coach || !('speechSynthesis' in window)) return;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.rate = 1.05; u.pitch = 1;
      speechSynthesis.speak(u);
      lastSpokenAt = performance.now();
    } catch {}
  }

  let wake = null;
  async function acquireWake() { try { if ('wakeLock' in navigator && !wake) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); } } catch {} }
  function releaseWake() { try { wake && wake.release(); } catch {} wake = null; }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && $('#timer').classList.contains('active')) acquireWake();
  });

  // ---------- Timer engine ----------
  // phase: idle → lead → work → (rest → work)* → done
  const T = { phase: 'idle', round: 1, len: 0, acc: 0, t0: 0, running: false, paused: false, marks: new Set(), lastN: -1, logged: 0, timer: 0 };
  const el = { timer: $('#timer'), fill: $('#fill'), phase: $('#phase'), big: $('#big'), sub: $('#sub'), play: $('#playBtn'), skip: $('#skipBtn'), pills: $('#pills'), hint: $('#hint') };
  const workLen = () => S.isCustom ? S.custom : S.duration;
  const elapsed = () => T.acc + (T.running ? (performance.now() - T.t0) / 1000 : 0);

  function openTimer() {
    const w = S.workout;
    el.timer.className = `screen active t-${w.tint}`;
    $('#tName').textContent = w.name;
    el.pills.innerHTML = S.sets > 1 ? Array.from({ length: S.sets }, () => '<i><u></u></i>').join('') : '';
    reset();
    acquireWake();
  }

  // carry = seconds already elapsed past the previous phase's end (keeps time exact if ticks were delayed).
  function enterPhase(phase, len, carry = 0) {
    Object.assign(T, { phase, len, acc: 0, t0: performance.now() - carry * 1000, running: true, paused: false, lastN: -1 });
    T.marks.clear();
    clearInterval(T.timer);
    T.timer = setInterval(tick, 50);
    if (phase === 'lead') el.big.classList.remove('lead-pop');
    if (carry > 0) tick(); else render();
  }
  function begin() {
    unlockAudio(); acquireWake();
    T.round = 1; T.logged = 0;
    enterPhase('lead', LEAD_IN);
  }
  function pause() {
    if (!T.running) return;
    T.acc = elapsed(); T.running = false; T.paused = true;
    clearInterval(T.timer);
    tone(440, .18, .14); buzz(30);
    render();
  }
  function resume() {
    if (!T.paused) return;
    T.t0 = performance.now(); T.running = true; T.paused = false;
    clearInterval(T.timer); T.timer = setInterval(tick, 50);
    tone(660, .14, .16); buzz(30);
    render();
  }
  function reset() {
    clearInterval(T.timer);
    Object.assign(T, { phase: 'idle', round: 1, acc: 0, running: false, paused: false, len: workLen(), logged: 0 });
    T.marks.clear();
    render();
  }
  function finishWork(e, carry) {
    addToLog(e); T.logged += e;
    if (T.round < S.sets) {
      softChime(); buzz([60, 60, 60]);
      if (S.rest > 0) { speak(`Set ${T.round} done. Rest.`); enterPhase('rest', S.rest, carry); }
      else { T.round++; speak('Next set. Go.'); enterPhase('work', workLen(), carry); }
    } else finish();
  }
  function finishEarly() {
    if (T.phase === 'work') { const e = elapsed(); addToLog(e); T.logged += e; }
    if (T.phase === 'work' || T.phase === 'rest' || T.phase === 'lead') finish();
  }
  function finish() {
    clearInterval(T.timer);
    T.running = false; T.paused = false; T.phase = 'done';
    doneChime(); buzz([80, 60, 160]);
    speak(T.logged >= 1 ? 'Done. Great work.' : 'Done.');
    render();
  }
  function skipRest() {
    if (T.phase !== 'rest') return;
    T.round++; goTone(); speak('Go'); enterPhase('work', workLen());
  }

  function tick() {
    if (!T.running) return;
    const e = elapsed(), rem = T.len - e, n = Math.ceil(rem);
    if (T.phase === 'lead') {
      if (n !== T.lastN && n > 0) { T.lastN = n; tick3(); buzz(20); el.big.classList.remove('lead-pop'); void el.big.offsetWidth; el.big.classList.add('lead-pop'); }
      if (rem <= 0) { goTone(); buzz(120); speak('Go'); enterPhase('work', workLen(), -rem); return; }
    } else if (T.phase === 'work') {
      const p = e / T.len;
      for (const m of [.25, .5, .75]) {
        if (p >= m && !T.marks.has(m)) {
          T.marks.add(m); softChime(); buzz(40);
          if (m === .5 && T.len >= 20 && rem > 11) speak('Halfway');
        }
      }
      if (T.len >= 30 && rem <= 10 && !T.marks.has('ten')) { T.marks.add('ten'); speak('Ten seconds'); }
      if (n <= 3 && n > 0 && n !== T.lastN) { T.lastN = n; tick3(); buzz(20); }
      if (rem <= 0) { finishWork(T.len, -rem); return; }
    } else if (T.phase === 'rest') {
      if (n <= 3 && n > 0 && n !== T.lastN) { T.lastN = n; tick3(); }
      if (rem <= 0) { T.round++; goTone(); buzz(120); speak('Go'); enterPhase('work', workLen(), -rem); return; }
    }
    render();
  }

  function setBig(sec, withUnit = true) {
    sec = Math.max(0, Math.ceil(sec));
    el.big.innerHTML = sec < 60 ? `${sec}${withUnit ? '<small>sec</small>' : ''}` : mmss(sec);
  }
  function setFill(p) { el.fill.style.transform = `translateY(${(1 - Math.min(1, Math.max(0, p))) * 100}%)`; }

  function render() {
    const e = elapsed(), ph = T.phase;
    el.timer.dataset.phase = ph;
    el.timer.classList.toggle('paused', T.paused);
    el.play.innerHTML = T.running ? PAUSE : PLAY;
    el.play.setAttribute('aria-label', T.running ? 'Pause' : 'Start');
    el.skip.hidden = !(ph === 'work' || ph === 'rest');
    el.skip.setAttribute('aria-label', ph === 'rest' ? 'Skip rest' : 'Finish now');
    const setTxt = S.sets > 1 ? `Set ${T.round} of ${S.sets}` : '';
    let pWork = 0;

    if (ph === 'idle') {
      setFill(0); setBig(workLen());
      el.phase.textContent = 'Ready';
      el.sub.innerHTML = S.sets > 1 ? `${S.sets} sets${S.rest ? ` · ${S.rest}s rest` : ''}` : 'Get into position';
    } else if (ph === 'lead') {
      setFill(0); setBig(T.len - e, false);
      el.phase.textContent = T.paused ? 'Paused' : 'Get ready';
      el.sub.textContent = setTxt;
    } else if (ph === 'work') {
      pWork = e / T.len;
      setFill(pWork); setBig(T.len - e);
      el.phase.textContent = T.paused ? 'Paused' : (setTxt || 'Keep going');
      el.sub.innerHTML = `<b>${human(Math.floor(e))}</b> done · ${Math.floor(pWork * 100)}%`;
    } else if (ph === 'rest') {
      setFill(1 - e / T.len); setBig(T.len - e);
      el.phase.textContent = T.paused ? 'Paused' : 'Rest';
      el.sub.textContent = `Next: set ${T.round + 1} of ${S.sets}`;
    } else if (ph === 'done') {
      setFill(1);
      el.phase.textContent = 'Done';
      const sets = S.sets > 1 ? ` · ${S.sets} sets` : '';
      el.sub.innerHTML = `<b>${human(T.logged)}</b> of ${S.workout.name}${sets}`;
      const days = lastDays(7);
      $('#sToday').textContent = human(days[6].sec);
      $('#sWeek').textContent = human(days.reduce((a, d) => a + d.sec, 0));
    }

    document.querySelectorAll('.mk').forEach(m => m.classList.toggle('hit', ph === 'work' && pWork >= +m.dataset.m));
    [...el.pills.children].forEach((pill, i) => {
      const r = i + 1;
      const v = ph === 'done' || r < T.round || (r === T.round && ph === 'rest') ? 1 : r === T.round && ph === 'work' ? pWork : 0;
      pill.firstChild.style.transform = `scaleX(${v})`;
    });

    el.hint.innerHTML =
      ph === 'idle' ? 'Say <q>start</q> or tap play' :
      ph === 'done' ? 'Say <q>again</q> to repeat' :
      T.paused ? 'Say <q>resume</q> or <q>reset</q>' :
      ph === 'rest' ? 'Say <q>skip</q> to go now · <q>stop</q> to pause' :
      'Say <q>stop</q> to pause · <q>finish</q> to end';
  }

  el.play.addEventListener('click', () => {
    unlockAudio();
    if (T.running) pause();
    else if (T.paused) resume();
    else begin();
  });
  $('#resetBtn').addEventListener('click', reset);
  el.skip.addEventListener('click', () => T.phase === 'rest' ? skipRest() : finishEarly());
  $('#againBtn').addEventListener('click', begin);
  $('#newBtn').addEventListener('click', closeTimer);
  $('#closeBtn').addEventListener('click', closeTimer);
  function closeTimer() {
    reset(); stopListening(); releaseWake();
    try { speechSynthesis.cancel(); } catch {}
    show('home');
  }
  document.addEventListener('keydown', e => {
    if (!el.timer.classList.contains('active')) return;
    if (e.code === 'Space') { e.preventDefault(); el.play.click(); }
    else if (e.key === 'r') reset();
  });

  // ---------- Voice control ----------
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const CMD = /\b(start over|let'?s go|keep going|start|go|begin|stop|pause|resume|continue|restart|reset|skip|next|finish|again|repeat)\b/g;
  const ACTION = {
    'start': 'start', 'go': 'start', 'begin': 'start', "let's go": 'start', 'lets go': 'start',
    'stop': 'pause', 'pause': 'pause',
    'resume': 'resume', 'continue': 'resume', 'keep going': 'resume',
    'reset': 'reset', 'restart': 'reset', 'start over': 'reset',
    'skip': 'skip', 'next': 'skip',
    'finish': 'finish',
    'again': 'again', 'repeat': 'again'
  };
  let rec = null, wantListen = false, handled = new Map(), heardTimer = 0;
  const mic = $('#micBtn'), micLabel = $('#micLabel');
  function micState(state, label) {
    mic.classList.toggle('on', state === 'on');
    mic.classList.toggle('err', state === 'err');
    micLabel.textContent = label;
  }

  function dispatch(word) {
    const a = ACTION[word.replace('’', "'")];
    if (!a) return;
    // Ignore our own spoken "Go" echoing back through the mic.
    if (a === 'start' && performance.now() - lastSpokenAt < 1500 && T.running) return;
    const ph = T.phase;
    let did = false;
    if (a === 'start' || a === 'again') {
      if (T.paused) { resume(); did = true; }
      else if (ph === 'idle' || ph === 'done') { begin(); did = true; }
    } else if (a === 'pause') { if (T.running) { pause(); did = true; } }
    else if (a === 'resume') { if (T.paused) { resume(); did = true; } }
    else if (a === 'reset') { if (ph !== 'idle') { reset(); did = true; } }
    else if (a === 'skip') { if (ph === 'rest') { skipRest(); did = true; } }
    else if (a === 'finish') { if (ph === 'work' || ph === 'rest' || ph === 'lead') { finishEarly(); did = true; } }
    if (did) {
      $('#heardWord').textContent = `“${word}”`;
      $('#heard').classList.add('show');
      clearTimeout(heardTimer);
      heardTimer = setTimeout(() => $('#heard').classList.remove('show'), 1400);
    }
  }

  function startListening() {
    if (!SR) { micState('err', 'No voice'); el.hint.innerHTML = 'Voice control needs Chrome, Edge or Safari. Tap play instead.'; return; }
    wantListen = true;
    if (rec) { try { rec.start(); } catch {} return; }
    rec = new SR();
    rec.continuous = true;
    rec.interimResults = true;
    rec.lang = 'en-US';
    rec.onstart = () => { handled = new Map(); micState('on', 'Listening'); };
    rec.onresult = ev => {
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        const text = ev.results[i][0].transcript.toLowerCase();
        const words = text.match(CMD) || [];
        const done = handled.get(i) || 0;
        // Act on interim results for speed; count per result so each spoken command fires once.
        for (let k = done; k < words.length; k++) dispatch(words[k]);
        handled.set(i, Math.max(done, words.length));
      }
    };
    rec.onerror = ev => {
      if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed') {
        wantListen = false; micState('err', 'Blocked');
        el.hint.innerHTML = 'Microphone blocked. Allow it in the browser, or tap play.';
      }
    };
    rec.onend = () => {
      if (wantListen) setTimeout(() => { if (wantListen) try { rec.start(); } catch {} }, 250);
      else micState('off', 'Off');
    };
    try { rec.start(); } catch {}
  }
  function stopListening() {
    wantListen = false;
    try { rec && rec.stop(); } catch {}
    micState('off', 'Off');
  }
  mic.addEventListener('click', () => wantListen ? stopListening() : startListening());

  renderHome();
})();
</script>
</body>
</html>
